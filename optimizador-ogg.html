<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Optimizador de Ogg para FNF</title>
<style>
:root{--bg:#f6f3fb;--card:#fff;--tx:#1d1730;--mu:#6b6480;--ac:#7a3cff;--ac2:#ffffff;--ok:#1a8f5a;--bd:#ddd6ee}
@media (prefers-color-scheme:dark){:root{--bg:#120f1d;--card:#1c1830;--tx:#efeafc;--mu:#a59dbd;--ac:#a57bff;--ac2:#120f1d;--ok:#4cd69a;--bd:#2f2948}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px;max-width:640px;margin-inline:auto}
h1{font-size:1.4rem;margin:.2rem 0 .3rem}
p.s{color:var(--mu);margin:0 0 14px;font-size:.92rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
label{display:block;font-size:.88rem;color:var(--mu);margin:10px 0 4px}
select,input[type=number]{width:100%;padding:10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:1rem}
.chk{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:.95rem;color:var(--tx)}
.chk input{width:20px;height:20px}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px 14px;background:var(--ac);color:var(--ac2);width:100%;margin-top:10px}
button.g{background:transparent;color:var(--ac);border:1.5px solid var(--ac)}
button:disabled{opacity:.45}
.row{display:flex;gap:8px}.row button{margin-top:10px}
#bar{height:10px;border-radius:6px;background:var(--bd);overflow:hidden;margin:10px 0 4px}
#bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .2s}
#st{font-size:.9rem;color:var(--mu)}
.sum{font-size:1.5rem;font-weight:700;color:var(--ok)}
.li{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd);font-size:.85rem}
.li b{font-weight:500;overflow-wrap:anywhere}.li span{white-space:nowrap;color:var(--mu)}
.li.k span{color:var(--tx)}
#list{max-height:300px;overflow:auto}
.err{color:#d6335a;font-size:.9rem}
</style>
</head>
<body>
<h1>Optimizador de Ogg para FNF</h1>
<p class="s">Reduce el peso de tus canciones .ogg directamente en el celular. Nada se sube a internet: todo se procesa en tu navegador.</p>

<div class="card">
  <input id="f1" type="file" accept=".ogg,.oga,audio/ogg,application/ogg" multiple hidden>
  <input id="f2" type="file" webkitdirectory multiple hidden>
  <div class="row">
    <button id="b1" class="g">Elegir archivos</button>
    <button id="b2" class="g">Elegir carpeta</button>
  </div>
  <div id="sel" class="s" style="margin:10px 0 0">Ningún archivo elegido.</div>

  <label for="q">Calidad de audio</label>
  <select id="q">
    <option value="8">Alta</option>
    <option value="9">Muy alta</option>
    <option value="10" selected>Máxima (recomendada para conservar las voces)</option>
  </select>

  <div class="chk"><input id="keep" type="checkbox" checked><span>Dejar el original si el resultado no es más liviano</span></div>

  <button id="go" disabled>Optimizar</button>
</div>

<div class="card" id="prog" hidden>
  <div id="bar"><i></i></div>
  <div id="st"></div>
  <div id="err" class="err"></div>
</div>

<div class="card" id="res" hidden>
  <div class="sum" id="sum"></div>
  <div id="sub" class="s"></div>
  <div id="dl"></div>
  <div id="list"></div>
</div>

<script>
const $=id=>document.getElementById(id);
let files=[];
const fmt=b=>b>=1048576?(b/1048576).toFixed(2)+" MB":(b/1024).toFixed(0)+" KB";
const tick=()=>new Promise(r=>setTimeout(r,0));

$("b1").onclick=()=>$("f1").click();
$("b2").onclick=()=>$("f2").click();
function pick(e){
  files=[...e.target.files].filter(f=>/\.(ogg|oga)$/i.test(f.name));
  const t=files.reduce((a,f)=>a+f.size,0);
  $("sel").textContent=files.length?files.length+" archivos .ogg · "+fmt(t):"No se encontraron archivos .ogg.";
  $("go").disabled=!files.length;
}
$("f1").onchange=pick;$("f2").onchange=pick;

// ---------- ZIP sin compresión (los Ogg ya vienen comprimidos) ----------
const CT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u){let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CT[(c^u[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
function makeZip(items){
  const enc=new TextEncoder(),parts=[],central=[];let off=0;
  for(const it of items){
    const nm=enc.encode(it.name);
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);
    h.setUint16(10,0,true);h.setUint16(12,0x5821,true);h.setUint32(14,it.crc,true);
    h.setUint32(18,it.size,true);h.setUint32(22,it.size,true);h.setUint16(26,nm.length,true);h.setUint16(28,0,true);
    parts.push(h.buffer,nm,it.blob);
    const c=new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);
    c.setUint16(10,0,true);c.setUint16(12,0,true);c.setUint16(14,0x5821,true);c.setUint32(16,it.crc,true);
    c.setUint32(20,it.size,true);c.setUint32(24,it.size,true);c.setUint16(28,nm.length,true);
    c.setUint32(42,off,true);
    central.push(c.buffer,nm);
    off+=30+nm.length+it.size;
  }
  let cs=0;central.forEach(x=>cs+=x.byteLength||x.length);
  const e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,items.length,true);e.setUint16(10,items.length,true);
  e.setUint32(12,cs,true);e.setUint32(16,off,true);
  return new Blob([...parts,...central,e.buffer],{type:"application/zip"});
}

// ---------- Procesamiento ----------
let createOggEncoder=null;
async function loadEncoder(){
  if(createOggEncoder)return;
  let m;\n  try{m=await import("https://cdn.jsdelivr.net/npm/wasm-media-encoders@0.7.0/+esm")}\n  catch(first){m=await import("https://esm.sh/wasm-media-encoders@0.7.0")}
  createOggEncoder=m.createOggEncoder||(m.default&&m.default.createOggEncoder);
  if(!createOggEncoder)throw new Error("El codificador Ogg no está disponible en esta versión.");
}

async function optimize(file,ctx,q){
  const ab=await file.arrayBuffer();
  const buf=await ctx.decodeAudioData(ab.slice(0));
  const chans=Array.from({length:buf.numberOfChannels},(_,i)=>buf.getChannelData(i));
  if(chans.length>2)throw new Error("Este codificador no admite más de dos canales; se conservará el archivo original.");
  const enc=await createOggEncoder();
  enc.configure({sampleRate:buf.sampleRate,channels:chans.length,vbrQuality:q});
  const out=[];let total=0;
  const step=buf.sampleRate*2;
  for(let i=0;i<L.length;i+=step){
    const r=enc.encode(chans.map(c=>c.subarray(i,Math.min(i+step,c.length))));
    if(r.length){out.push(r.slice());total+=r.length}
    if((i/step)%8===7)await tick();
  }
  const fin=enc.finalize();
  if(fin.length){out.push(fin.slice());total+=fin.length}
  const all=new Uint8Array(total);let p=0;for(const c of out){all.set(c,p);p+=c.length}
  return all;
}

$("go").onclick=async()=>{
  const q=parseFloat($("q").value),keep=$("keep").checked;
  if(!files.length)return;\n  $("go").disabled=true;$("prog").hidden=false;$("res").hidden=true;$("err").textContent="";
  $("list").innerHTML="";$("dl").innerHTML="";
  let wl=null;try{wl=await navigator.wakeLock.request("screen")}catch(e){}
  try{
    $("st").textContent="Cargando codificador…";
    await loadEncoder();
  }catch(e){
    $("err").textContent="No se pudo cargar el codificador (necesita internet la primera vez): "+e.message;
    $("go").disabled=false;return;
  }
  const AudioCtx=window.AudioContext||window.webkitAudioContext;\n  if(!AudioCtx){$("err").textContent="Este navegador no permite procesar audio. Probá con Chrome o Firefox actualizado.";$("go").disabled=false;if(wl)try{wl.release()}catch(e){}return}\n  let ctx;\n  try{ctx=new AudioCtx({sampleRate:44100})}catch(e){ctx=new AudioCtx()}
  const done=[],used=new Set();let before=0,after=0,fail=0;
  for(let i=0;i<files.length;i++){
    const f=files[i];
    $("st").textContent=`(${i+1}/${files.length}) ${f.name}`;
    $("bar").firstElementChild.style.width=(i/files.length*100)+"%";
    await tick();
    let name=f.webkitRelativePath||f.name;
    if(used.has(name)){let n=2,b=name.replace(/\.(ogg|oga)$/i,""),ext=(name.match(/\.(ogg|oga)$/i)||[".ogg"])[0];while(used.has(`${b} (${n})${ext}`))n++;name=`${b} (${n})${ext}` }
    used.add(name);
    let data,kept=false;
    try{
      const o=await optimize(f,ctx,q);
      if(keep&&o.length>=f.size*0.97){data=new Uint8Array(await f.arrayBuffer());kept=true}else data=o;
    }catch(e){
      fail++;data=new Uint8Array(await f.arrayBuffer());kept=true;
    }
    before+=f.size;after+=data.length;
    done.push({name,blob:new Blob([data]),crc:crc32(data),size:data.length});
    const pc=Math.round((1-data.length/f.size)*100);
    const li=document.createElement("div");li.className="li"+(kept?"":" k");
    li.innerHTML=`<b></b><span>${fmt(f.size)} → ${fmt(data.length)} (${kept?"sin cambios":"-"+pc+"%"})</span>`;
    li.firstChild.textContent=name;$("list").prepend(li);
  }
  $("bar").firstElementChild.style.width="100%";
  $("st").textContent="Listo. Armando los ZIP…";await tick();
  // Un único ZIP con todos los archivos; los OGG ya están comprimidos.
  const groups=[done];
  const url=URL.createObjectURL(makeZip(groups[0]));
  const b=document.createElement("button");
  b.textContent=`Descargar ZIP (${groups[0].length} archivos)`;
  b.onclick=()=>{const a=document.createElement("a");a.href=url;a.download="ogg-optimizados.zip";document.body.appendChild(a);a.click();a.remove()};
  $("dl").appendChild(b);
  const sv=before?Math.round((1-after/before)*100):0;
  $("sum").textContent=`${fmt(before)} → ${fmt(after)} (${sv>=0?"ahorro "+sv+"%":"aumentó "+Math.abs(sv)+"%"})`;
  $("sub").textContent=fail?`${fail} archivo(s) no se pudieron procesar y se incluyeron sin cambios. Revisá que sean OGG válidos.`:"Los nombres de archivo se mantienen iguales. Descomprimí y reemplazá los originales.";
  $("st").textContent="Terminado.";$("res").hidden=false;$("go").disabled=false;
  try{await ctx.close()}catch(e){}if(wl)try{wl.release()}catch(e){}
};
</script>
</body>
</html>
